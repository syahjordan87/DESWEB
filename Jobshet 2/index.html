<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIMPUS-Mini | Jobsheet 2</title>

  <style>
    /* =========================
       1. Palet warna UI/UX
       ========================= */
    :root {
      --primary: #0f766e;       /* hijau teal */
      --primary-dark: #155e75;  /* biru teal */
      --background: #f1f5f9;    /* latar halaman */
      --surface: #ffffff;       /* permukaan kartu */
      --surface-soft: #ecfeff;  /* latar kartu statistik */
      --border: #99f6e4;
      --text: #1e293b;
      --text-muted: #64748b;
      --shadow: 0 5px 15px rgba(15, 23, 42, 0.08);
    }

    /* Reset dasar */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--background);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* =========================
       2. FLEXBOX: navbar
       Mengatur logo dan menu
       ========================= */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 20px;
      padding: 18px 30px;
      color: white;
      background: linear-gradient(110deg, var(--primary), var(--primary-dark));
      box-shadow: 0 3px 8px rgba(15, 23, 42, 0.18);
    }

    .brand {
      font-size: 28px;
      font-weight: 700;
      white-space: nowrap;
    }

    .nav-links {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 10px 24px;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
      transition: opacity 0.2s ease;
    }

    .nav-links a:hover {
      opacity: 0.78;
      text-decoration: underline;
    }

    /* Konten utama */
    main {
      width: min(1046px, calc(100% - 40px));
      margin: 35px auto 0;
    }

    .card {
      background: var(--surface);
      border-radius: 14px;
      padding: 30px 27px;
      margin-bottom: 26px;
      box-shadow: var(--shadow);
    }

    .welcome h1,
    .summary h2 {
      color: var(--primary);
      font-size: 26px;
      line-height: 1.35;
      margin-bottom: 20px;
    }

    .welcome p {
      font-size: 17px;
    }

    .summary h2 {
      margin-bottom: 30px;
    }

    /* =========================
       3. CSS GRID: kartu statistik
       Tiga kolom dengan jarak rapi
       ========================= */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 17px;
    }

    .stat-card {
      min-height: 128px;
      display: flex; /* Flexbox untuk isi tiap kartu */
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: linear-gradient(135deg, var(--surface-soft), #f0fdfa);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .stat-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 18px rgba(15, 118, 110, 0.12);
    }

    .stat-card h3 {
      color: #475569;
      font-size: 16px;
      margin-bottom: 12px;
    }

    .stat-card p {
      color: var(--primary);
      font-size: 30px;
      font-weight: 700;
      line-height: 1.2;
    }

    footer {
      padding: 35px 15px 28px;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
    }

    /* =========================
       4. Responsive layout
       Grid dan Flexbox menyesuaikan
       ukuran layar
       ========================= */
    @media (max-width: 900px) {
      .navbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .nav-links {
        justify-content: flex-start;
      }
    }

    @media (max-width: 650px) {
      .navbar {
        padding: 18px;
      }

      .brand {
        font-size: 25px;
      }

      .nav-links {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        width: 100%;
        gap: 12px;
      }

      .nav-links a {
        font-size: 14px;
      }

      main {
        width: calc(100% - 28px);
        margin-top: 22px;
      }

      .card {
        padding: 23px 20px;
        margin-bottom: 20px;
      }

      .welcome h1,
      .summary h2 {
        font-size: 22px;
      }

      .welcome p {
        font-size: 15px;
      }

      /* Grid berubah menjadi satu kolom di layar kecil */
      .stats {
        grid-template-columns: 1fr;
        gap: 13px;
      }

      .stat-card {
        min-height: 105px;
      }

      footer {
        padding-top: 20px;
      }
    }
  </style>
</head>

<body>
  <!-- Navbar menggunakan Flexbox -->
  <header class="navbar">
    <div class="brand">SIMPUS-Mini</div>

    
<nav class="nav-links" aria-label="Navigasi utama">
  <a href="index.html">Beranda</a>
  <a href="Buku/List.html">Daftar Buku</a>
  <a href="Buku/Tambah.html">Tambah Buku</a>
  <a href="Anggota/List.html">Daftar Anggota</a>
  <a href="Anggota/Tambah.html">Tambah Anggota</a>
</nav>

  </header>

  <main>
    <section class="card welcome">
      <h1>Selamat Datang di Sistem Perpustakaan Mini</h1>
      <p>Aplikasi sederhana untuk mengelola data buku dan anggota perpustakaan.</p>
    </section>

    <section class="card summary">
      <h2>Ringkasan</h2>

      <!-- Grid mengatur tiga kartu statistik -->
      <div class="stats">
        <article class="stat-card">
          <h3>Total Buku</h3>
          <p>12</p>
        </article>

        <article class="stat-card">
          <h3>Total Anggota</h3>
          <p>8</p>
        </article>

        <article class="stat-card">
          <h3>Sedang Dipinjam</h3>
          <p>3</p>
        </article>
      </div>
    </section>
  </main>

  <footer>
    &copy; 2026 SIMPUS-Mini &mdash; Jobsheet 2
  </footer>
</body>
</html>
